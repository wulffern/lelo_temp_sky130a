#- The cell's declarations, and since there is no LELOTEMP_OTAR.py,
#- the WHOLE truth: subcells, membership, placement order, floorplan
#- rows, channels and supplies. cicpy's sidecar recipe executes it
#- (see cicpy/core/sidecarcell.py); a .py would win if one existed,
#- for a cell that needs something the recipe cannot say.
#-
#- Order matters twice here, and both were measured:
#- * every N stack puts its xns gate device at the BOTTOM, so the
#-   subcell's tab-lane rail spans the rows above it and the parent's
#-   powerdown via stack still lands on the tab;
#- * p_bias runs (xba1, xba8, xba2, xba6, xba7, xba3): xba8's gate
#-   tab lies below every PWRUP_1V8 tab, and VO's (xba8,xba2) and
#-   VBP's (xba6,xba7) drains both stay adjacent. orderByTerminalNet
#-   interleaved the gate tabs down the one lane, where no pair of
#-   rails can coexist.
place:
  groupbreak: 6
  channel: 6

subcells:
  - name: p_in_a
    match: '^(xbl4|xbl1<\d+>|xstack_p_in_a_(top|bot)|xfill_p_in_a_\d+)$'
    type: stack
    group: pmos
    channel: in_a
    order: ['xbl4', 'xbl1<\d+>']
  - name: p_in_b
    match: '^(xbl5|xbl2<\d+>|xstack_p_in_b_(top|bot)|xfill_p_in_b_\d+)$'
    type: stack
    group: pmos
    channel: in_b
    order: ['xbl5', 'xbl2<\d+>']
  - name: p_bias
    match: '^(xba\d+|xstack_p_bias_(top|bot)|xfill_p_bias_\d+)$'
    type: stack
    group: pmos
    channel: bias
    order: ['xba1', 'xba8', 'xba2', 'xba6', 'xba7', 'xba3']
  - name: p_sw
    match: '^(xbs\d+|xstack_p_sw_(top|bot)|xfill_p_sw_\d+)$'
    type: stack
    group: pmos
    channel: sw
    order: ['xbs6', 'xbs1', 'xbs2', 'xbs4', 'xbs7', 'xbs8']
  - name: n_load_a
    match: '^(xnd1<\d+>|xnd3|xns1|xstack_n_load_a_(top|bot)|xfill_n_load_a_\d+)$'
    type: stack
    group: nmos
    order: ['xns1', 'xnd1<\d+>', 'xnd3']
  - name: n_load_b
    match: '^(xnd2<\d+>|xnd4|xns2|xstack_n_load_b_(top|bot)|xfill_n_load_b_\d+)$'
    type: stack
    group: nmos
    order: ['xns2', 'xnd2<\d+>', 'xnd4']
  - name: n_mirr
    match: '^(xnc0|xnc1<\d+>|xns4|xstack_n_mirr_(top|bot)|xfill_n_mirr_\d+)$'
    type: mirror
    group: nmos
    order: ['xns4', 'xnc0', 'xnc1<\d+>']
  - name: r_deg
    match: '^(xd2<\d+>|xstack_r_deg_(top|bot)|xfill_r_deg_\d+)$'
    type: stack
    group: res
    channel: res
    fill: false
    order: ['xd2<\d+>']

rows:
  - [n_load_a, n_load_b, n_mirr, r_deg]
  - [p_in_a, p_in_b, p_bias, p_sw]

supplies:
  - {net: VDD_1V8, ring: t, guard_exclude: '^xbs6$', strap: top}
  - {net: VSS, ring: b, strap: bottom, strap_exclude: '^xd2<[1-9]'}
