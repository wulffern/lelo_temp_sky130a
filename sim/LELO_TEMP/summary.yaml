description: LELO_TEMP
simulations:
   tran:
    name: Temperature sensor
    description: |
      Check temperature accuracy

      The Sch rows are the schematic netlist, the Lay rows the parasitic
      extraction of the finished layout. Both views run the same sets:
      typical, the extreme test condition corners (etc) and mismatch
      (mc). Calibration is per corner at Vt (process); the supply
      corners reuse their process corner's calibration.
    data:
      - name: Sch_typ
        src: results/tran_Sch_typical
        method: typical
      - name: Sch_etc
        src: results/tran_Sch_etc
        method: minmax
      - name: Sch_3std
        src: results/tran_Sch_mc
        method: 3std
      - name: Lay_typ
        src: results/tran_Lay_typical
        method: typical
      - name: Lay_etc
        src: results/tran_Lay_etc
        method: minmax
      - name: Lay_3std
        src: results/tran_Lay_mc
        method: 3std
      - name: Lay_supply
        src: results/tran_Lay_supply
        method: minmax
