# Tiny Tapeout project information
project:
  title:        "LELO-TEMP"
  author:       "Carsten Wulff"
  discord:      "cwulffern"
  description:  "Temperature-to-frequency sensor: bandgap-referenced bias, relaxation oscillator whose period tracks temperature"
  language:     "Analog"
  clock_hz:     0

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # How many analog pins does your project use?
  analog_pins: 0
  uses_vapwr: false

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_lelo_temp_wulffern"

  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "PWRUP_ANA"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "OSC_TEMP"
  uo[1]: ""
  uo[2]: ""
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins
  ua[0]: ""
  ua[1]: ""
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
